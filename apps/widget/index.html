<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Alfsight — Dev Preview</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      max-width: 800px;
      margin: 40px auto;
      padding: 0 20px;
      background: #fafafa;
      color: #262626;
    }
  </style>
</head>
<body>
  <!-- Widget usage example -->
  <instagram-feed
    id="widget"
    feed="demo-feed-id"
    api-base=""
  ></instagram-feed>

  <script type="module" src="/src/index.ts"></script>
  <script>
    const params = new URLSearchParams(window.location.search);
    const feedId = params.get("feed");
    if (feedId) {
      document.getElementById("widget")?.setAttribute("feed", feedId);
    }
  </script>
</body>
</html>
