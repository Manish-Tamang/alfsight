<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Alfsight — Dev Preview</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      max-width: 800px;
      margin: 40px auto;
      padding: 0 20px;
      background: #fafafa;
      color: #262626;
    }
  </style>
</head>
<body>
  <!-- Widget usage example -->
  <instagram-feed
    id="widget"
    feed="demo-feed-id"
    api-base=""
  ></instagram-feed>

  <script type="module" src="/src/index.ts"></script>
  <script>
    // The dashboard embeds this page as a live preview: ?feed=<id>&api=<api base>
    const params = new URLSearchParams(window.location.search);
    const widget = document.getElementById("widget");
    const feedId = params.get("feed");
    const apiBase = params.get("api");
    if (feedId) widget?.setAttribute("feed", feedId);
    if (apiBase) widget?.setAttribute("api-base", apiBase);
  </script>
</body>
</html>
